name: Refresh data

# Daily, not because the sources change daily — most are annual — but because
# NOAA's CO₂ trend does, and because refresh.ts gates every other source on its
# own published `nextUpdate` and skips when it isn't due. The artifact is
# rebuilt each run regardless, since the nowcast moves the displayed numbers
# every day even when no new observation landed.
on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Guards the model itself. A refresh that publishes a broken score is
      # worse than one that doesn't run.
      - name: Test the scoring model
        run: npm test

      # Every key below is optional. An adapter whose credential is missing
      # reports itself unavailable and its metric goes stale; the run still
      # publishes. That is the Ember contract, extended to the newer keyed
      # sources — one unset secret must not cost the other fifteen metrics.
      #
      # NSIDC, WHO and UNHCR need no credential at all and always run.
      - name: Refresh observations
        run: npm run data:refresh
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EMBER_API_KEY: ${{ secrets.EMBER_API_KEY }}
          GFW_API_KEY: ${{ secrets.GFW_API_KEY }}
          ELECTRICITY_MAPS_API_KEY: ${{ secrets.ELECTRICITY_MAPS_API_KEY }}
          ELECTRICITY_MAPS_ZONE: ${{ vars.ELECTRICITY_MAPS_ZONE }}
          ACLED_USERNAME: ${{ secrets.ACLED_USERNAME }}
          ACLED_PASSWORD: ${{ secrets.ACLED_PASSWORD }}
          ACLED_CLIENT_ID: ${{ secrets.ACLED_CLIENT_ID }}

      # The seeded metrics cannot be fetched — RSF, Walk Free, Access Now and
      # FEWS NET publish annual PDFs and web maps, not feeds. What this step
      # automates is the *noticing*: it reports how far past its update window
      # each CSV has drifted, so a file nobody has touched shows up in the run
      # log instead of quietly freezing a tile at a two-year-old number.
      #
      # Deliberately non-fatal. A stale press-freedom score is not a reason to
      # skip publishing sixteen other metrics.
      - name: Check seeded data freshness
        if: always()
        continue-on-error: true
        run: npm run data:seeds:check

      - name: Build artifact
        run: npm run data:artifact -- --out humanity.json
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # Runs a second time, and this is the run that matters. The drift guard in
      # scoring.test.ts compares the client's maths against a built artifact,
      # which does not exist on a fresh checkout — so on the first pass it skips
      # itself. Here the artifact is on disk, and a composite the app would
      # compute differently from the one the server wrote fails before it is
      # published rather than after.
      - name: Re-check the model against the built artifact
        run: npm test

      - name: Publish artifact
        run: npm run data:publish
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # The published artifact is the only thing the app reads, so keeping a
      # copy of each run's output makes a bad number diagnosable after the fact.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: humanity-json
          path: humanity.json
          retention-days: 14

  # A separate job, not another step, and deliberately so. The two pipelines
  # share a schedule and nothing else: the metrics artifact must still publish
  # on a morning when every news feed is down, and a story worth reading must
  # still land on a morning when OWID has changed its CSV format again.
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Guards the feed parser. A malformed <item> that silently yields nothing
      # looks exactly like a quiet news day, so this runs before the fetch.
      - name: Test the feed parser
        run: npm test

      - name: Refresh news
        run: npm run news:refresh
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
